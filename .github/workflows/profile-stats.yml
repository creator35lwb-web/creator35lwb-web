name: Profile stats

on:
  schedule:
    - cron: "17 0 * * *"  # daily, 08:17 Malaysia time
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/profile_stats.py

      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/top-langs.svg; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "chore: refresh profile stats cards"
          git push
